[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ntab-bci"
version = "0.1.0"
description = "NT@B FA26 - EEG Motor Imagery Classification"
authors = [{name = "Raghav"}]
requires-python = ">=3.9"
dependencies = [
    "mne>=1.6",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "scipy>=1.11",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/ntab-eeg-bci"

[tool.setuptools.packages.find]
where = ["src"]
