[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ntab-bci"
version = "0.1.0"
description = "NT@B FA26 - EEG Motor Imagery Classification"
authors = [{name = "Raghav"}]
requires-python = ">=3.9"
dependencies = [
    "mne==1.13.0",
    "scikit-learn==1.9.0",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "joblib==1.6.0",
    "matplotlib==3.11.1",
    "seaborn==0.13.2",
    "tqdm==4.70.0",
    "pyyaml==6.0.3",
    "pyriemann==0.12",
]

[tool.setuptools.packages.find]
where = ["src"]
