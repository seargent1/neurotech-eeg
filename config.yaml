# Left vs right fist classification

data_dir: data/eegmmidb

# use first N subjects (1..N). override with: python scripts/train_compare.py --subjects 10
n_subjects: 30

runs:
  executed: [3, 7, 11]
  imagined: [4, 8, 12]

primary_condition: imagined  # imagined | executed | both

# epoch window (seconds after cue)
tmin: 0.5
tmax: 3.5

# band-pass filter (mu/beta)
l_freq: 8.0
h_freq: 30.0

# csp settings
n_csp_components: 6
csp_reg: 0.05

random_seed: 42
n_jobs: -1
